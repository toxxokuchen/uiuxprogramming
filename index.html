<!doctype html>
<!--
UX 질문:
사용자는 누구인가?:
  외국어를 학습하는 성인 학습자
페이지의 목적은?:
  자신이 학습한 단어를 기록 및 복습
사용자의 핵심 행동은 무엇?:
  단어를 입력, 필요한 입력을 사용, 자신이 학습하는 내용에 대한 조회
정보를 어떤 순서로 보여줄 것인가?:
  정보 순서: 서비스 소개>가입/로그인>일일 단어 복습 화면 > 단어장 목록 > 새로운 단어 등록
-->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Vocabulet</title>
  </head>
  <body>
    <header>
      <h1>보카블릿:외국어 단어 복습 사이트</h1>
      <p>학습하는 외국어의 단어를 편리하게 복습합니다.</p>
    </header>

    <h2>서비스 소개</h2>
    <h3>일일 외국어 단어 학습 및 복습</h3>
    <p>
      보카블릿은 외국어 단어를 자기주도적으로 학습하고 복습할 수 있는 웹
      서비스입니다.
    </p>
  </body>
</html>

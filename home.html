<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <title>내 단어장 | Vocabulet</title>
  </head>

  <body>
    <a class="skip-link" href="#top">본문 바로가기</a>
    <div id="liveStatus" class="sr-only" role="status" aria-live="polite"></div>

    <header class="site-header">
      <h1><a id="site-logo" href="index.html">Vocabulet</a></h1>
      <p class="header-description">오늘도 단어를 학습합시다.</p>

      <button
        type="button"
        id="menuButton"
        class="menu-button"
        aria-expanded="false"
        aria-controls="mainNav"
      >
        메뉴
      </button>
      <nav id="mainNav" class="site-nav" aria-label="주요 메뉴">
        <a href="#daily-review">일일 복습</a>
        <a href="#add-word">단어 등록</a>
        <a href="#wordbook">단어장</a>
        <a href="#config">화면 테마</a>
      </nav>
    </header>

    <main id="top" tabindex="-1">
      <section
        id="daily-review"
        class="content-section"
        aria-labelledby="review-title"
      >
        <h2 id="review-title">일일 단어 복습</h2>
        <p class="review-progress">1 / 10</p>

        <article class="flash-card" id="flashCard" aria-label="단어 카드">
          <div class="flash-card-inner">
            <div class="flash-card-front" id="cardFront">
              <span class="word-language"></span>
              <strong class="word-text"></strong>
            </div>
            <div class="flash-card-back" id="cardBack" aria-hidden="true" inert>
              <p class="word-meaning"></p>
              <p class="word-example"></p>
            </div>
          </div>
        </article>

        <div class="review-actions" id="reviewActions">
          <button
            type="button"
            id="flipButton"
            aria-expanded="false"
            aria-controls="cardBack"
          >
            뜻 보기
          </button>
          <button type="button" id="knowButton">알고 있어요</button>
          <button type="button" id="unknownButton">모르겠어요</button>
        </div>
      </section>

      <section
        id="add-word"
        class="content-section"
        aria-labelledby="add-title"
      >
        <h2 id="add-title">새로운 단어 등록</h2>
        <form id="word-form">
          <label for="wordLanguage">언어</label>
          <select id="wordLanguage" name="language">
            <option>영어</option>
            <option>일본어</option>
            <option>중국어</option>
            <option>스페인어</option>
            <option>프랑스어</option>
          </select>

          <label for="wordInput">단어</label>
          <input type="text" id="wordInput" name="word" required />

          <label for="meaningInput">뜻</label>
          <input type="text" id="meaningInput" name="meaning" required />

          <label for="exampleInput">예문 (선택)</label>
          <textarea id="exampleInput" name="example"></textarea>

          <button type="submit" id="wordSubmit" disabled>단어 등록</button>
          <button type="button" id="editCancel" hidden>수정 취소</button>

          <p id="wordMessage" aria-live="polite"></p>
        </form>
      </section>

      <section
        id="wordbook"
        class="content-section"
        aria-labelledby="wordbook-title"
      >
        <h2 id="wordbook-title" tabindex="-1">단어장</h2>
        <div class="word-filters" role="group" aria-label="단어 필터">
          <button
            type="button"
            class="filter-button active"
            data-filter="all"
            aria-pressed="true"
            aria-controls="wordList"
          >
            전체
          </button>
          <button
            type="button"
            class="filter-button"
            data-filter="known"
            aria-pressed="false"
            aria-controls="wordList"
          >
            알고 있는 단어
          </button>
          <button
            type="button"
            class="filter-button"
            data-filter="unknown"
            aria-pressed="false"
            aria-controls="wordList"
          >
            모르는 단어
          </button>
        </div>
        <p class="word-count" id="wordCount"></p>
        <ul class="word-list" id="wordList" role="list"></ul>
      </section>

      <section
        id="config"
        class="content-section"
        aria-labelledby="config-title"
      >
        <article class="event-card">
          <h2 id="config-title">화면 테마</h2>
          <button
            id="themeButton"
            class="primary-button"
            type="button"
            aria-pressed="false"
          >
            다크 테마 사용
          </button>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      ⓒ 2026 외국어 단어 학습 서비스 Vocabulet.
    </footer>
    <script src="script.js"></script>
    <script src="home.js"></script>
  </body>
</html>
